; WordNote 配置 —— 改完关掉程序重新打开生效
; 热键写法：Ctrl+Alt+Z / Shift+F8 / Alt+Space ...

snip=Ctrl+Alt+S
reselect=Ctrl+Alt+Shift+S
play_pause=Ctrl+Alt+Space
focus=Ctrl+Alt+W
auto=Ctrl+Alt+G
note=Ctrl+Alt+N

; 速记框上次的位置和大小（拖动/缩放后自动记下，-1 = 自动）
note_x=-1
note_y=-1
note_w=-1
note_h=-1

; 速记框外观：透明度 0.3-1.0 / 圆角 px / 字号 pt / 主题 dark|light
note_opacity=0.72
note_radius=14
note_font=12
note_theme=dark

; 输入框里的灰色提示字 / 底部那行小字
note_cue=输入文字，回车自动写进 Word
note_hint=↵ 写入 Word   ·   按住这里拖动   ·   边角可缩放

; 1=回车后保持常驻（继续打，Esc 关） 0=写完自动收起
note_stay=1

; 1=开 0=关：任何截图工具截的图都自动进 Word
auto_mode=1
; 图片后面空几行
lines_after=1
; 图片宽度占版心宽度的百分比 20-100（COM 通道用）
image_width_percent=100
; 备用通道（剪贴板+Ctrl+V）把图缩到的像素宽度
paste_width_px=500

; 秒截区域 x,y,w,h（留 0 表示还没设置）
region=0,0,0,0

; 用 WPS 的话把下面改成 KWPS.Application（不确定就先用 Word）
word_progid=Word.Application
word_class=OpusApp

; 插入目标窗口（托盘里点“选择 Word 窗口…”设置；0=自动挑）
word_hwnd=0
word_title=
