; WordNote 配置 —— 改完关掉程序重新打开生效
; 热键写法：Ctrl+Alt+Z / Shift+F8 / Alt+Space ...

snip=Ctrl+Alt+S
reselect=Ctrl+Alt+Shift+S
play_pause=Ctrl+Alt+Space
focus=Ctrl+Alt+W
auto=Ctrl+Alt+G

; 1=开 0=关：任何截图工具截的图都自动进 Word
auto_mode=1
; 图片后面空几行
lines_after=1
; 图片宽度占版心宽度的百分比 20-100
image_width_percent=100
; 秒截区域 x,y,w,h（留 0 表示还没设置）
region=0,0,0,0

; 用 WPS 的话把下面改成 KWPS.Application（不确定就先用 Word）
word_progid=Word.Application
word_class=OpusApp
paste_width_px=500
